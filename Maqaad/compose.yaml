services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: maqad
      DB_USERNAME: maqad
      DB_PASSWORD: maqad_password
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: maqad
      POSTGRES_USER: maqad
      POSTGRES_PASSWORD: maqad_password
    ports:
      - "5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U maqad -d maqad
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: